name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Create Release must be run from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push release tag
        id: tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./release.sh origin
          tag="v$(git show HEAD:VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Created \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Start release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        # A tag pushed with GITHUB_TOKEN does not trigger push workflows.
        run: gh workflow run release.yml --ref "$RELEASE_TAG" -f publish=true

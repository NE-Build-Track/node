name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Keep main builds independent so every successful commit can be published.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Linux ${{ matrix.arch }}
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      BUILD_RELEASE: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Release metadata
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse HEAD)
          go_version=$(awk '$1 == "go" {print $2}' go.mod)
          release=$(< VERSION)
          [[ "$release" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'VERSION must be MAJOR.MINOR.PATCH, without a v prefix, leading zeroes, prerelease suffixes, or build metadata.' >&2
            exit 1
          }
          version="v$release-${commit:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" == "v$release" ]] || {
              echo "Tag $REF_NAME does not match VERSION $release." >&2
              exit 1
            }
            version="$REF_NAME"
          fi
          {
            echo "version=$version"
            echo "go=$go_version"
            echo "commit=$commit"
            echo "epoch=$(git show -s --format=%ct HEAD)"
            echo "bundle=livepeer-${version}-linux-${ARCH}"
          } >> "$GITHUB_OUTPUT"
      - name: Build binaries through the Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: binaries
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
          outputs: type=local,dest=${{ runner.temp }}/bin
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
      - name: Verify static binaries
        run: |
          for binary in livepeer livepeer-orchestrator livepeer-signer livepeer-chain livepeer-discovery; do
            path="$RUNNER_TEMP/bin/$binary"
            # A static ELF must have neither an interpreter nor shared-library dependencies.
            readelf --program-headers "$path" > "$RUNNER_TEMP/program-headers"
            readelf --dynamic "$path" > "$RUNNER_TEMP/dynamic"
            if grep -Eq 'INTERP' "$RUNNER_TEMP/program-headers" || grep -Eq 'NEEDED' "$RUNNER_TEMP/dynamic"; then
              echo "$binary is not statically linked" >&2
              exit 1
            fi
          done
      - name: Package deterministic bundle and checksums
        if: env.BUILD_RELEASE == 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
          RELEASE_GO_VERSION: ${{ steps.metadata.outputs.go }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
          BUNDLE: ${{ steps.metadata.outputs.bundle }}
        run: |
          mkdir -p dist "$RUNNER_TEMP/package/$BUNDLE/bin"
          cp "$RUNNER_TEMP/bin/"* "$RUNNER_TEMP/package/$BUNDLE/bin/"
          cp LICENSE "$RUNNER_TEMP/package/$BUNDLE/"
          printf 'version=%s\ncommit=%s\ngo=go%s\nos=linux\narch=%s\n' \
            "$RELEASE_VERSION" "$RELEASE_COMMIT" "$RELEASE_GO_VERSION" "$ARCH" > "$RUNNER_TEMP/package/$BUNDLE/VERSION"
          (
            cd "$RUNNER_TEMP/package/$BUNDLE"
            sha256sum bin/* > SHA256SUMS
            chmod 755 . bin bin/*
            chmod 644 LICENSE VERSION SHA256SUMS
          )
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            --format=gnu -C "$RUNNER_TEMP/package" -cf - "$BUNDLE" | gzip -n > "dist/$BUNDLE.tar.gz"
          (cd dist && sha256sum "$BUNDLE.tar.gz" > "$BUNDLE.tar.gz.sha256")
      - name: Install and smoke test without Go
        if: env.BUILD_RELEASE == 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
          BUNDLE: ${{ steps.metadata.outputs.bundle }}
        run: |
          docker run --rm --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user 65534:65534 \
            --tmpfs /tmp:rw,exec,mode=1777 \
            -v "$PWD/dist:/artifacts:ro" \
            -v "$PWD/.github/scripts/release-smoke.sh:/smoke.sh:ro" \
            alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659 \
            sh /smoke.sh "/artifacts/$BUNDLE.tar.gz" "$RELEASE_VERSION" "$RELEASE_COMMIT"
      - name: Package image from verified binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # Matching inputs reuse the binaries stage compiled above.
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
          load: true
          tags: livepeer:test-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
      - name: Smoke test image
        env:
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE_COMMIT: ${{ steps.metadata.outputs.commit }}
          IMAGE: livepeer:test-${{ matrix.arch }}
        run: sh .github/scripts/docker-smoke.sh "$IMAGE" "$IMAGE_VERSION" "$IMAGE_COMMIT"
      - name: Save tested release bundle
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Export tested image
        if: github.event_name == 'push'
        env:
          IMAGE: livepeer:test-${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/docker-$ARCH.tar" "$IMAGE"
      - name: Save tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish verified bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          verify_tag() {
            remote_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)
            if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Tag $RELEASE_TAG no longer points to built commit $RELEASE_COMMIT; refusing to publish." >&2
              exit 1
            fi
          }
          verify_tag
          # Leave incomplete uploads as a draft, and permit a retry of that draft.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          verify_tag
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false

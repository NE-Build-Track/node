name: Go

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release control tests
        run: bash .github/scripts/test-release.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            echo 'Run go fmt ./... to fix formatting.' >&2
            exit 1
          fi
      - name: SDK fixture paths
        run: |
          {
            echo "GO_RUNNER_SDK_DIR=$RUNNER_TEMP/golang-runner"
            echo "PYTHON_RUNNER_SDK_DIR=$RUNNER_TEMP/livepeer-python-gateway"
            echo "PYTHON_RUNNER_PYTHON=$RUNNER_TEMP/livepeer-python-gateway/.venv/bin/python"
          } >> "$GITHUB_ENV"
      - name: Pin Go Live Runner SDK fixture
        run: |
          git clone https://github.com/livepeer/golang-runner.git "$GO_RUNNER_SDK_DIR"
          git -C "$GO_RUNNER_SDK_DIR" checkout --detach c3be5a14a91f8a3437133419becaced324d804fe
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Pin Python Live Runner SDK fixture
        run: |
          git clone https://github.com/livepeer/livepeer-python-gateway.git "$PYTHON_RUNNER_SDK_DIR"
          git -C "$PYTHON_RUNNER_SDK_DIR" checkout --detach 76a1a1c58656ef2ad0c28542ea5f99086b76db69
          uv sync --project "$PYTHON_RUNNER_SDK_DIR" --locked --no-dev --extra examples --python 3.12
      - name: Race and real-process tests
        run: |
          mkdir -p "${{ runner.temp }}/livepeer-test-artifacts"
          go test -race -artifacts -outputdir=${{ runner.temp }}/livepeer-test-artifacts ./...
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          overwrite: true
          path: ${{ runner.temp }}/livepeer-test-artifacts
          if-no-files-found: ignore
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

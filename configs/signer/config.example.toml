# DataDir may be set in an explicitly selected config; relative DataDir values use this file's directory.
# DataDir = "/var/lib/livepeer/signer" # Accounts then use DataDir/keystore.
# Deployment template: configure the RPCURLFile and KeystorePasswordFile

# Signer TOML uses the names shown below; flags use kebab-case.
# See docs/signer.md and docs/configuration.md.
Listen = "127.0.0.1:8937"
MetricsListen = "127.0.0.1:8938"
# Account = "0xYOUR_ACCOUNT" # Select among shared accounts.
# KeystoreFile = "/run/secrets/livepeer-signer-keystore.json" # Override discovery.
KeystorePasswordFile = "/run/secrets/livepeer-signer-keystore-password"
# Encrypted geth account JSON; both files must be owner-only.
# To use LIVEPEER_SIGNER_KEYSTORE_PASSWORD instead, remove KeystorePasswordFile.

# Orchestrators to use
Orchestrators = []

# Private discovery IPs, IP:port, or CIDRs such as "10.0.0.0/8"; see docs/signer.md.
DiscoveryGrants = []

# The signer requires an on-chain connection at startup.
# The RPC URL is an exact-byte secret file (omit a trailing newline).
RPCURLFile = "/run/secrets/livepeer-signer-rpc-url"

# On-chain defaults; custom networks require chain and contract settings.
# Network = "arbitrum-one-mainnet" # Signer default
# ChainID = 42161
# Defaults target Arbitrum mainnet; override for another chain.
# Controller = "0xD8E8328501E9645d16Cf49539efC04f734606ee4"
# ETHUSDFeed = "0x639Fe6ab55C921f74e7fac1ee960C0B6293ba612"
# WeiPerUSD = "500000000000000" # Fixed conversion overrides oracle, for testing.

# USD is implicit. Live quotes are compared with MaxHourlyPrice / 3600.
MaxHourlyPrice = "36"
MaxFixedPrice = "1"
ETHUSDMaxAge = "2h"

# Expected value (EV) limits are in wei and independent of work's maxPrice.
MaxTicketEV = "3000000000000"
MaxBatchEV = "20000000000000"
DepositMultiplier = 1

# Run alongside a clearinghouse for authorization and cumulative spending limits;
# see docs/signer.md for webhook and Kafka accounting integration.
# Signed state is a bearer credential. Authorization caching is generally discouraged;
# the webhook should omit expiry or return zero to authorize every payment.
# The webhook receives proposed payment state; data is returned only after approval.
# Both webhook values are secret files.
# Header syntax: Authorization: Bearer credential,X-Key: key
# Quote an entire entry using CSV syntax if its value contains commas:
# "X-List: a,b",Authorization: Bearer credential
# AuthWebhookFile = "/run/secrets/livepeer-signer-auth-url"
# AuthWebhookHeadersFile = "/run/secrets/livepeer-signer-auth-headers"

# Optional durable accounting events. Omit all Kafka settings to disable.
# Supplying any Kafka setting requires Broker and Topic.
# Provide one bootstrap host[:port]; Kafka discovers other brokers.
# OutboxDB defaults to events.sqlite under the data directory.
# Keep one outbox per replica.
# TLS with system trust roots is the default when the scheme is omitted.
# kafka:// explicitly uses plaintext transport; kafkas:// explicitly uses TLS.
# Credentials must be paired and enable SASL. AuthMethod is a strict enum:
# plain, scram-sha-256, scram-sha-512 (default).
# Omitted ports use signer conventions: plaintext 9092, TLS-only 9093,
# SASL/SCRAM 9096, SASL/PLAIN 9094. An explicit port always overrides these.
# Provider listeners can differ: e.g. MSK private TLS-only uses 9094.
# [Kafka]
# Broker = "broker.example.com"
# Topic = "livepeer-signing"
# AuthMethod = "scram-sha-512"
# UsernameFile = "/run/secrets/kafka-username"
# PasswordFile = "/run/secrets/kafka-password"
# OutboxDB = "/var/lib/livepeer/signer-events.sqlite"
# OutboxMaxBytes = 268435456 # Pending JSON payloads; default 256 MiB.
